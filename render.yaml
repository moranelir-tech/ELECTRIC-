services:
  - type: web
    name: electricity-compare
    runtime: docker
    plan: starter
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      # הכתובת הזמנית של Render. אחרי חיבור דומיין מעדכנים כאן ובדאשבורד
      - key: SITE_URL
        value: https://electricity-compare.onrender.com
      # off = האתר מסומן noindex ולא מופיע בגוגל. לפרסום מחליפים ל-on
      - key: SITE_INDEXING
        value: "off"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /data
      # ADMIN_PASSWORD לא מוגדר בכוונה: פאנל הניהול נעול עד שמוסיפים אותו בדאשבורד
